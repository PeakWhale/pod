name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
      - name: Run CLI examples
        run: |
          uv run pod cluster --example regional-markets
          uv run pod cluster --example customer-accounts -k 3
